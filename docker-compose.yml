version: "3.9"

networks:
  default:
    name: gift-assigner-network

services:
  giftassigner: # Gift  Assigner service
    networks:
      - default
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: &PGDATABASE "everphone"
      POSTGRES_USER: &PGUSER "postgres"
      POSTGRES_PASSWORD: &PGPASSWORD "postgres"
      POSTGRES_HOST: &PGHOST "postgres"
      POSTGRES_PORT: &PGPORT "5432"
      PGSSLMODE: &PGSSLMODE "disable"
      PORT: &PORT "8080"
      REDIS_DEFAULT_ADDR: &REDIS_DEFAULT_ADDR "host.docker.internal:6379"
      REDIS_PASSWORD: &REDIS_PASSWORD "eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81"
  postgres: # postgres service
    networks:
      - default
    image: postgres:14-alpine 
    command: "postgres -c 'shared_buffers=128MB' -c 'fsync=off' -c 'synchronous_commit=off' -c 'full_page_writes=off' -c 'max_connections=100' -c 'client_min_messages=warning'"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      POSTGRES_DB: *PGDATABASE
      POSTGRES_USER: *PGUSER
      POSTGRES_PASSWORD: *PGPASSWORD
    volumes:
      - ./scripts/:/docker-entrypoint-initdb.d/

  redis:
    image: redis:alpine
    restart: always
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      REDIS_DISABLE_COMMANDS: "FLUSHDB,FLUSHALL"
      REDIS_DEFAULT_ADDR: *REDIS_DEFAULT_ADDR
      REDIS_PASSWORD: *REDIS_PASSWORD

    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    volumes:
      - 'redis_data:/data'
    networks:
      - default

volumes:
  pgvolume: # declare a named volume to persist DB data
  redis_data:
    driver: local